name: Backend tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'src/requirements*.txt'
      - run: pip install -r src/requirements-render.txt -r src/requirements.txt
      - run: python src/download_data.py
      - run: python src/train.py
      - run: python src/test_system.py
      - run: python src/test_wsgi.py
      - run: python src/test_mcp.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
        env:
          GRIDWATCH_API_URL: https://example.onrender.com
